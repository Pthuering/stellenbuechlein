# Sammelt täglich um 12 Uhr (deutsche Zeit) neue Anzeigen ein, sucht gezielt nach Anzeigen von Websites,
# die noch nicht im Register stehen, und verschickt fällige Fristen-Erinnerungen. Zusätzlich jederzeit per
# Knopf in der App („Jetzt einsammeln“) oder hier über „Run workflow“.
# Den täglichen Start gibt seit 24.11.2026 der Cloudflare-Worker (Cron-Auslöser, apps/api/wrangler.toml) über
# workflow_dispatch: Der Zeitplan von GitHub kam an den Tagen davor 7 bis 11 Stunden zu spät.
# Solange der Lauf läuft, ist die KI-Warteschlange gesperrt (apps/ingest/src/sperre.ts); die KI-Arbeiter fangen
# also erst an, wenn alles Neue eingereiht ist.
# Läuft kostenlos in GitHub Actions (öffentliches Repo: unbegrenzt, privates: 2.000 Minuten/Monat).
# Seit 24.11.2026 ohne Mengengrenzen (alle neuen Anzeigen jeder Quelle, die ganze Browser-Warteschlange): Bekannte und
# schon aussortierte Adressen erkennt der Lauf und liest sie nicht neu. Grenze ist nur die Laufzeit von 6 Stunden.
# Die KI-Arbeit (auswerten, Fristen, Horizont, Weite) landet in der KI-Warteschlange; direkt nach dem Lauf startet
# eine Claude-Cloud-Aufgabe, die sie abarbeitet (Skill .claude/skills/ki-aufgaben, docs/BETRIEB.md).
# Benötigte Secrets: API_URL, INGEST_KEY; optional BRAVE_API_KEY, VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY,
# CLAUDE_TASK_URL und CLAUDE_TASK_TOKEN (API-Auslöser der Cloud-Aufgabe)

name: Einsammeln

on:
  # Kein eigener Zeitplan mehr: Den täglichen Start um 12 Uhr gibt der Worker (siehe oben).
  workflow_dispatch: {}

concurrency:
  group: einsammeln
  cancel-in-progress: false

jobs:
  uhrzeit:
    runs-on: ubuntu-latest
    outputs:
      los: ${{ steps.check.outputs.los }}
    steps:
      - id: check
        name: Uhrzeit prüfen (12 Uhr deutscher Zeit)
        run: |
          offset=$(TZ=Europe/Berlin date +%z)
          los=0
          # Ohne Zeitplan kommt jeder Start von Hand oder vom Worker und läuft sofort los
          if [ "${{ github.event_name }}" != "schedule" ]; then los=1; fi
          echo "Deutsche Zeit: $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M') (UTC$offset), Start: $los"
          echo "los=$los" >> "$GITHUB_OUTPUT"

  einsammeln:
    needs: uhrzeit
    if: needs.uhrzeit.outputs.los == '1'
    # Festes Ubuntu 24.04: ubuntu-latest ist seit November 2026 Ubuntu 26.04, dort lässt sich der Browser von Playwright 1.56 nicht installieren.
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      API_URL: ${{ secrets.API_URL }}
      # Zwischenzertifikate (GÉANT/HARICA), die manche Hochschul-Server nicht mitschicken (apps/ingest/certs)
      NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/apps/ingest/certs/zwischenzertifikate.pem
      INGEST_KEY: ${{ secrets.INGEST_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      CLAUDE_TASK_URL: ${{ secrets.CLAUDE_TASK_URL }}
      # Browser-Warteschlange mit 4 Seiten gleichzeitig (wie im großen Durchlauf), sonst reichen 6 Stunden nicht
      BROWSER_CONCURRENCY: 4
      # Reserve über die 2 GB hinaus, die Node sonst nutzt (die Maschine hat 7 GB)
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Browser für den Browser-Agenten installieren
        run: npx playwright@1.56.0 install --with-deps chromium
      - name: Startdaten abgleichen (neue Einrichtungen aus dem Repo übernehmen)
        run: npm run cli -w @stellen/ingest -- seed
      - name: Anzeigen einsammeln (mit Erkundung neuer Websites)
        run: npm run cli -w @stellen/ingest -- ingest
      # Auch nach einem abgebrochenen Lauf: Was bis dahin in der Warteschlange liegt, wird aufbereitet
      - name: Claude die KI-Aufgaben abarbeiten lassen
        if: ${{ !cancelled() && env.CLAUDE_TASK_URL != '' }}
        env:
          CLAUDE_TASK_TOKEN: ${{ secrets.CLAUDE_TASK_TOKEN }}
        run: |
          curl -fsS -X POST "$CLAUDE_TASK_URL" \
            -H "Authorization: Bearer $CLAUDE_TASK_TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d '{"text": "Einsammeln fertig"}' -o /dev/null
