# Optional: App und API bei jedem Push auf main zu Cloudflare hochladen.
# Benötigte Secrets: CLOUDFLARE_API_TOKEN (Vorlage "Edit Cloudflare Workers"), CLOUDFLARE_ACCOUNT_ID

name: Veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ vars.AUTO_DEPLOY == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Datenbank-Migrationen anwenden
        run: npm run db:migrate:remote -w @stellen/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Worker mit App hochladen
        run: npm run deploy -w @stellen/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
