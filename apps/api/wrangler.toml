# Cloudflare Worker: API + Auslieferung der PWA (kostenloser Plan reicht).
# Ohne eigene Domain läuft die App unter https://stellenbuechlein.<dein-name>.workers.dev.
# Einrichtung: siehe docs/BETRIEB.md

name = "stellenbuechlein"
main = "src/worker.ts"
compatibility_date = "2026-06-01"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Eigene Adresse (docs/BETRIEB.md, Schritt 2a): Die Domain muss bei Cloudflare verwaltet
# werden (kostenloser Plan). Dann die drei Zeilen unten aktivieren, Adresse eintragen
# und "npm run deploy". DNS-Eintrag und Zertifikat legt Cloudflare selbst an.
# Mit eigener Adresse schaltet Cloudflare die workers.dev-Adresse ab; deshalb danach
# das GitHub-Secret API_URL auf die neue Adresse umstellen.
# [[routes]]
# pattern = "stellen.deine-domain.de"
# custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "stellenbuechlein"
# Angelegt mit "npx wrangler d1 create stellenbuechlein --jurisdiction eu" (EU, Region EEUR):
database_id = "30e4d077-8757-4837-aa95-1171805c704a"
migrations_dir = "../../packages/db/migrations"

[vars]
# Nur wenn die App auf deiner eigenen Website liegt (Website-Paket, docs/WEBSITE.md) und dieser Worker
# nur den Server spielt: Adresse(n) der Website, mehrere mit Komma. Läuft die App im Worker selbst: leer lassen.
# ALLOWED_ORIGIN = "https://deine-website.de, https://www.deine-website.de"
# Öffentlicher VAPID-Schlüssel für Push-Erinnerungen (npx web-push generate-vapid-keys)
VAPID_PUBLIC_KEY = "BAize3hKDPROdNO5AZZIrWQ-jBB159_L4nUTtvAfiOI4uo6obwIf0vBaSxe0xxxdLiSIULk2lMN9rP5AHgWHcRc"
# Optional für "Jetzt einsammeln" und den Probelauf neuer Quellen: Repository im Format besitzer/name
GITHUB_REPO = "Pthuering/stellenbuechlein"
GITHUB_WORKFLOW = "einsammeln.yml"
GITHUB_CHECK_WORKFLOW = "quelle-pruefen.yml"
# Optional: KI im Worker für Brücken-Vorschläge im Horizont (OpenAI-kompatibel, Standard DeepSeek)
LLM_BASE_URL = "https://api.deepseek.com"
LLM_MODEL = "deepseek-chat"

# Geheimnisse (nicht hier eintragen!):
#   npx wrangler secret put APP_KEY      – Schlüssel für die App
#   npx wrangler secret put INGEST_KEY   – Schlüssel für die Einsammel-Pipeline
#   npx wrangler secret put GITHUB_TOKEN – optional, Fine-grained Token mit "Actions: write"
#   npx wrangler secret put LLM_API_KEY  – optional, KI-Schlüssel für Brücken-Vorschläge
